[project]
name = "polymarket-oracle-risk"
version = "0.1.0"
description = "Risk analyzer for Polymarket oracle (UMA OO) resolutions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kyeong Sun Kim" }]
keywords = ["polymarket", "prediction-markets", "uma", "oracle", "risk", "bayesian"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Intended Audience :: Financial and Insurance Industry",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.12",
    "pydantic>=2.5",
    "httpx>=0.27",
    "gql[httpx]>=3.5",
    "numpyro>=0.15",
    "jax>=0.4",
    "tenacity>=9.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
streamlit = ["streamlit>=1.40", "plotly>=5.24", "duckdb>=1.1"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.122",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]

[project.urls]
Homepage = "https://github.com/ksk5429/polymarket-oracle-risk"
Documentation = "https://ksk5429.github.io/polymarket-oracle-risk/"
Repository = "https://github.com/ksk5429/polymarket-oracle-risk"
Issues = "https://github.com/ksk5429/polymarket-oracle-risk/issues"
Changelog = "https://github.com/ksk5429/polymarket-oracle-risk/blob/main/CHANGELOG.md"

[project.scripts]
polymarket-oracle-risk = "polymarket_oracle_risk.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polymarket_oracle_risk"]

[tool.hatch.build.targets.sdist]
exclude = ["/.github", "/streamlit_app", "/tests/fixtures/*.parquet"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "S", "C4", "PTH", "PL"]
ignore = [
    "S101", "PLR0913", "PLR2004", "E501",
    "RUF002",          # α, β are math notation, not typos
    "N803", "N806",    # ML convention: X = feature matrix
    "PLC0415",         # JAX + NumPyro lazy-import is deliberate
    "SIM105", "S110",  # try/except/pass is clearer here
    "PLW0603",         # process-wide singleton pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N806", "PLC0415"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = ["slow: expensive tests", "network: requires network"]

[tool.coverage.run]
branch = true
source = ["src/polymarket_oracle_risk"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
